name: Update PROGRESS.md on PR merge

on:
  pull_request:
    types: [closed]
    branches: [main]

jobs:
  update-progress:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ref: main
      - name: Append merge to PROGRESS.md session log
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
          PR_NUM: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          DATE=$(date +%Y-%m-%d)
          echo "| ${DATE} | ${BRANCH} | PR #${PR_NUM} merged | ${PR_TITLE} |" >> PROGRESS.md
      - name: Commit PROGRESS.md update
        env:
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PROGRESS.md
          git diff --staged --quiet || git commit -m "chore: PROGRESS.md — ${BRANCH} merged [skip ci]"
          git push
